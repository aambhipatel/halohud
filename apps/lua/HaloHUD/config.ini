; All offsets are 1920x1080 design pixels. Sliders and mouse dragging apply instantly and auto-save.
[HUD]
; All in-game controls auto-save after 0.4 seconds idle; Save writes immediately.
PROFILE_CPU = 0
AERO_ANIMATION_MS = 420
; N/R pulse takes twice this duration, with 30% enlargement.
GEAR_ANIMATION_MS = 260
LEADERBOARD_ANIMATION_MS = 450
ENABLED = 1
SCALE = 1.0
X_OFFSET = 0
Y_OFFSET = 0
; 0 = flat ribbon, 1 = reference bend; supported 0..1.6.
CURVE = 1.0
OPACITY = 0.95
; KMH or MPH; both are always displayed, this picks the upper value.
UNITS = KMH
; FULL = surname, CODE = first 3 letters; long names shrink to fit.
DRIVER_NAMES = FULL
; TEAL, ICE or AMBER; navy glass remains navy.
THEME = TEAL
; AUTO = real telemetry when a car exists, ON = synthetic, OFF = hide if no car.
DEMO = AUTO
; HUD remains visible independently of the controls window.
; Pedals only: exponential time constant in milliseconds. Speed/RPM are unsmoothed.
PEDAL_DAMPING_MS = 70
; Fixed 0..15 x1000 RPM scale, adjustable for cars outside this range.
RPM_MAX = 15000
; 8..32 strips per panel, not per glyph. Default balances smoothness and cost.
CURVE_STRIPS = 12

; Live per-region scales, clamped 0.5..1.5. Regions reflow to prevent overlap.
LEFT_SCALE = 1.0
DIAL_SCALE = 1.0
MODULE_SCALE = 1.0
RIGHT_SCALE = 1.0
OUTER_ARC = 0
; Charge fraction per second: 0.10 = ten percentage points per second.
RECOVERY_MAX_RATE = 0.10
; Unchanged charge is sampled over this window before declaring it unmeasurable.
RECOVERY_WINDOW_MS = 250
ENERGY_DAMPING_MS = 70
; BRAKE or EMPTY, only when charging and charge rate cannot be measured.
RECOVERY_FALLBACK = BRAKE
; DRS_OR_P2P (default), DRS, or EMPTY: non-KERS deploy fallback.
NO_KERS_DEPLOY = DRS_OR_P2P
; p2pStatus active encoding is not documented in the SDK. -1 disables P2P.
; Set only to an active status value verified for your car; no value is guessed.
P2P_ACTIVE_STATUS = -1
GEAR_COUNT = 8
REV_LIMIT_RPM = 0

[CAR_PROFILE_FORMULA_ULTRA_26]
ENABLED = 1
CAR_ID = formula_ultra_26
; The following strings are from ui/ui_car.json (UI claims, not physics data).
NAME = Formula Ultra 2026
CLASS = race
UI_BHP = 950 bhp
UI_TORQUE = 575Nm
UI_WEIGHT = 768kg*
UI_TOP_SPEED = 350+km/h
UI_ACCELERATION = 2s 0-100
UI_POWER_WEIGHT = 0.81 kg/hp
; extension/ext_config.ini, not inferred from a filename.
DISPLAY_MESH = LCD
DISPLAY_SCRIPT = SF24_Display_script.lua
; data.acd was NOT opened/unpacked. -1 = unknown / no numeric override.
; Live car.rpmLimiter and car.gearCount are used only for this exact car ID.
USE_LIVE_POWERTRAIN = 1
RPM_MAX = -1
REV_LIMIT_RPM = -1
GEARS = -1
RECOVERY_MAX_RATE = -1
BATTERY_CAPACITY_KJ = -1

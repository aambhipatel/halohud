name: Publish release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release or retry (for example v1.10.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: python -m pip install -r source/requirements.txt

      - name: Check tag matches app version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import configparser, os
          config = configparser.ConfigParser()
          config.read("apps/lua/HaloHUD/manifest.ini")
          expected = "v" + config["ABOUT"]["VERSION"].strip()
          assert os.environ["RELEASE_TAG"] == expected, (
              f"Tag must match manifest version: {expected}"
          )
          PY

      # Keep app/test sources from the release tag, but use the packaging fix
      # committed alongside this workflow, including during old-tag recovery.
      - name: Check out current packaging tool
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: source/build_package.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare clean release output
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path.cwd().resolve()
          output = root / "dist"
          assert output.resolve().parent == root
          if output.exists():
              shutil.rmtree(output)
          output.mkdir()
          shutil.copy2(root / ".release-tools/source/build_package.py",
                       root / "source/build_package.py")
          PY

      - name: Extract release description from README changelog
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python source/extract_release_notes.py "$RELEASE_TAG" --output dist/release-notes.md

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build packages
        run: |
          python source/build_package.py
          python - <<'PY'
          from pathlib import Path
          import zipfile
          print("Generated files:")
          for path in sorted(Path("dist").iterdir()):
              print(f"  {path.name}: {path.stat().st_size} bytes")
          for name in ("HaloHUD-install.zip", "HaloHUD-complete.zip"):
              path = Path("dist") / name
              assert path.is_file(), f"Missing expected asset: {path}"
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
          PY

      - name: Upload ZIPs to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh --version
          install=(dist/HaloHUD-install.zip)
          complete=(dist/HaloHUD-complete.zip)
          for asset in "${install[0]}" "${complete[0]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing expected release ZIP: $asset"
              ls -la dist || true
              exit 1
            fi
          done

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published. Refusing to overwrite it."
              echo "For an incomplete published release, check its state and use a new version if immutable."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi

          # Resume only drafts. Never delete/recreate a published release or tag.
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file dist/release-notes.md

          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "${install[0]}" "${complete[0]}" --clobber; then
              uploaded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Asset upload failed; retrying in $((attempt * 5)) seconds."
              sleep "$((attempt * 5))"
            fi
          done
          if [[ "$uploaded" != "true" ]]; then
            echo "Upload failed. Release remains a draft; rerun this workflow after investigating the error."
            exit 1
          fi

          # All expected files uploaded successfully before the release is made public.
          gh release edit "$RELEASE_TAG" --draft=false
